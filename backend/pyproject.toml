[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reg-engine-backend"
version = "0.1.0"
description = "FastAPI backend foundation for Registry Engine"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "openpyxl>=3.1,<4.0",
    "reportlab>=4.2,<5.0",
    "cryptography>=43,<46",
    "regex==2026.7.10",
]

[project.scripts]
reg-engine-mcp = "app.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pypdf>=5.0,<7.0",
    "types-regex==2026.7.10.20260711",
    "pre-commit>=3.8,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

